<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        /* General styles with CSS Variables for theming */
        :root {
            --primary-color: #3498db;
            --primary-color-dark: #2980b9;
            --background-gradient-start: #e0eafc;
            --background-gradient-end: #cfdef3;
            --container-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --shadow-light: rgba(0, 0, 0, 0.06);
            --shadow-medium: rgba(0, 0, 0, 0.1);
            --quick-access-bg: #eef5fc;
            --delete-color: #e74c3c;
            --item-bg: #ffffff;
            --item-hover-bg: #f0f0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }

        body {
            font-family: 'Lora', serif; /* Changed font */
            background: linear-gradient(135deg, var(--background-gradient-start), var(--background-gradient-end));
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.5s ease, color 0.5s ease;
        }
        
        /* Theme Change Button */
        .theme-button-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            display: flex;
            gap: 10px;
        }

        .theme-button, .profile-button, .export-button, .import-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .theme-button:hover, .theme-button:active,
        .profile-button:hover, .profile-button:active,
        .export-button:hover, .export-button:active,
        .import-button:hover, .import-button:active {
            background-color: var(--primary-color-dark);
            transform: scale(1.1);
        }


        /* Splash Screen Styles */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-out;
            pointer-events: auto;
        }

        .splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .splash-message {
            font-size: 2.5em;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.4);
            opacity: 0;
            animation: message-fade-in 1.2s ease-out forwards;
            text-align: center;
            padding: 0 25px;
            line-height: 1.3;
        }

        /* Main Content Fade In */
        .main-content-wrapper {
            opacity: 0;
            transition: opacity 0.7s ease-in;
            width: 100%;
            max-width: 1000px;
        }

        .main-content-wrapper.show {
            opacity: 1;
        }

        @keyframes message-fade-in {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .container {
            width: 100%;
            margin: 20px auto;
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px var(--shadow-medium);
            padding: 25px 35px; /* More horizontal padding */
            overflow: hidden;
            transition: background-color 0.5s ease;
        }
        
        .header {
            text-align: center;
        }

        .header .greeting-container {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: clamp(1.5em, 4.5vw, 2.8em); /* Adjusted responsive font size */
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            min-height: 1.2em;
            line-height: 1.2;
            transition: transform 0.2s ease-out;
            word-wrap: break-word; /* Added for wrapping */
            overflow-wrap: break-word; /* Standard property */
        }
        
        .greeting-container.interactive h1:hover {
            transform: scale(1.05);
        }

        .greeting-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            top: 100%; /* Position below the h1 */
            left: 50%;
            transform: translateX(-50%) scale(0.5); /* Base transform */
            background-color: var(--text-primary);
            color: var(--container-bg);
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 500;
            white-space: nowrap;
            margin-top: 15px; /* Space between text and tooltip */
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.4s ease-out, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Slower transition */
        }
        
        .greeting-tooltip::after {
            content: "";
            position: absolute;
            bottom: 100%;  /* At the top of the tooltip */
            left: 50%;
            margin-left: -10px;
            border-width: 10px;
            border-style: solid;
            border-color: transparent transparent var(--text-primary) transparent;
        }

        .greeting-container.interactive:hover .greeting-tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) scale(1) translateY(0);
        }


        /* Greeting Animation */
        .typewriter-bounce .char {
            opacity: 0;
            animation: typeBounce 0.1s ease-out forwards;
        }

        @keyframes typeBounce {
            0% { 
                opacity: 0;
                transform: translateY(10px);
            }
            60% { 
                opacity: 1;
                transform: translateY(-2px);
            }
            100% { 
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Search Bar Styles */
        .search-bar-container {
            margin: 0 auto 25px auto;
            padding: 15px 20px;
            background: var(--item-bg);
            border: 1px solid var(--text-secondary);
            border-radius: 12px;
            box-shadow: 0 4px 15px var(--shadow-light);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: box-shadow 0.3s ease, background-color 0.5s ease;
            max-width: 700px;
            width: 100%;
        }

        .search-input {
            flex-grow: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 1.5em;
            outline: none;
            background-color: transparent;
            color: var(--text-primary);
        }

        @keyframes blink-cursor {
            from, to { box-shadow: inset 2px 0 0 0 transparent; }
            50% { box-shadow: inset 2px 0 0 0 var(--text-primary); }
        }
        .search-input:focus:placeholder-shown {
            animation: blink-cursor 1s step-end infinite;
        }
        
        /* Loading Dots Animation */
        .loading-dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--primary-color);
            border-radius: 50%;
            animation: loading-bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots .dot1 { animation-delay: -0.32s; }
        .loading-dots .dot2 { animation-delay: -0.16s; }

        @keyframes loading-bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Quick Access Section Styles */
        .quick-access-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); /* Responsive grid */
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px;
            background: var(--quick-access-bg);
            border-radius: 14px;
            box-shadow: 0 4px 15px var(--shadow-light);
            transition: background-color 0.5s ease;
        }

        .quick-access-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; /* Full width within grid cell */
            aspect-ratio: 1 / 1; /* Maintain square shape */
            background: var(--item-bg);
            border-radius: 16px; 
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.5s ease;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }
        .quick-access-item:active {
             transform: scale(0.95); /* Visual feedback for touch */
        }
         .quick-access-item:hover {
            background-color: var(--item-hover-bg);
        }

        .quick-access-icon {
            font-size: 2.5em;
            margin-bottom: 5px;
            width: 45px;
            height: 45px;
            object-fit: contain;
        }
        .quick-access-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--text-primary);
        }

        .quick-access-title {
            font-size: 0.8em;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 0 5px;
            text-transform: uppercase;
        }

        /* Category and Bookmark Styles */
        .category-section {
            margin-bottom: 30px;
        }

        .category-section h2 {
            font-size: 1.8em;
            color: var(--text-primary);
            margin-bottom: 20px;
            cursor: pointer;
            display:flex; 
            align-items:center;
        }
        .category-section h2::after {
            content: '▼';
            margin-left: auto;
            transition: transform 0.3s ease;
        }
        .category-section.open h2::after {
            transform: rotate(180deg);
        }

        .category-section ul {
            list-style: none;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s ease-out;
        }

        .category-section.open ul {
            max-height: 2000px;
        }
        
        .bookmark-item-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .bookmark-item-content {
            background: var(--item-bg);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s ease-out, background-color 0.5s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            user-select: none;
        }
         .bookmark-item-content.swiped {
            transform: translateX(-80px);
        }

        .bookmark-item-content:active {
            background-color: var(--item-hover-bg);
        }
        
        .bookmark-details {
             display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .bookmark-details a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.1em;
            font-weight: 600;
        }

        .bookmark-details .bookmark-description {
            font-size: 0.95em;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        
        .swipe-delete-button {
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 100%;
            background-color: var(--delete-color);
            color: white;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            cursor: pointer;
        }

        .category-favicon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }
        
        /* Custom Context Menu */
        .custom-context-menu {
            position: absolute;
            z-index: 1000;
            background-color: var(--item-bg);
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 5px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: none;
        }
        .custom-context-menu li {
            padding: 8px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: var(--text-primary);
        }
        .custom-context-menu li:hover {
            background-color: var(--item-hover-bg);
        }
        .custom-context-menu li .delete-icon {
            color: var(--delete-color);
        }

        .no-results-message {
            text-align: center;
            padding: 40px;
            font-size: 1.3em;
            color: var(--text-secondary);
            background: var(--quick-access-bg);
            border-radius: 12px;
            margin-top: 40px;
            box-shadow: 0 4px 15px var(--shadow-light);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; transition: opacity 0.3s ease-out; pointer-events: none;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content {
            background-color: var(--container-bg); padding: 30px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); max-width: 600px; width: 90%;
            transform: translateY(-20px); opacity: 0; transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            position: relative;
        }
        .modal-overlay.open .modal-content { transform: translateY(0); opacity: 1; }
        .modal-header h3 { font-size: 1.8em; color: var(--text-primary); margin: 0; }
        .modal-close-button { background: none; border: none; font-size: 1.8em; color: var(--text-secondary); cursor: pointer; transition: color 0.2s ease; }
        .modal-close-button:hover { color: #333; }
        .modal-body { color: var(--text-primary); }
        .form-group label { color: var(--text-secondary); }
        .form-group input, .form-group textarea {
            background-color: var(--item-bg);
            color: var(--text-primary);
            border: 1px solid var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="theme-button-container">
        <button id="profile-button" class="profile-button" title="Profile">👤</button>
        <button id="export-button" class="export-button" title="Export Data">💾</button>
        <button id="import-button" class="import-button" title="Import Data">📂</button>
        <button id="theme-button" class="theme-button" title="Change Theme">🎨</button>
    </div>
    <input type="file" id="import-file-input" accept=".json" style="display: none;">

    <div id="splash-screen" class="splash-screen">
        <div class="splash-message"></div>
    </div>

    <div id="main-content-wrapper" class="main-content-wrapper">
        <div class="container">
            <div class="header">
                 <div class="greeting-container">
                    <h1 id="greeting-header"></h1>
                    <div id="greeting-tooltip" class="greeting-tooltip">Click to translate!</div>
                </div>
                <div class="search-bar-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Search or press Enter...">
                    <div id="search-loader" class="loading-dots" style="display: none;">
                        <span class="dot1"></span>
                        <span class="dot2"></span>
                        <span class="dot3"></span>
                    </div>
                </div>
            </div>

            <div class="quick-access-section" id="quick-access-section"></div>
            <div id="bookmark-categories-section"></div>
            <div id="no-results-message" class="no-results-message" style="display: none;"></div>
        </div>
    </div>
    
    <!-- Add/Edit Bookmark Modal -->
    <div id="add-bookmark-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="form-modal-title">Add New Bookmark</h3>
                <button id="add-modal-close-button" class="modal-close-button">×</button>
            </div>
            <div class="modal-body">
                 <form id="add-bookmark-form">
                    <div class="form-group">
                        <label for="bookmark-title">Title</label>
                        <input type="text" id="bookmark-title" required>
                    </div>
                    <div class="form-group">
                        <label for="bookmark-url">URL</label>
                        <input type="url" id="bookmark-url" required>
                    </div>
                    <div class="form-group">
                        <label for="bookmark-folder">Category (existing or new)</label>
                        <input type="text" id="bookmark-folder" list="category-suggestions" required>
                        <datalist id="category-suggestions"></datalist>
                    </div>
                     <div class="form-group">
                        <label for="bookmark-description">Description (optional)</label>
                        <textarea id="bookmark-description"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="form-submit-btn">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Custom Context Menu for deletion -->
    <div id="custom-context-menu" class="custom-context-menu">
        <ul>
            <li id="delete-context-btn"><span class="delete-icon">🗑️</span> Delete</li>
        </ul>
    </div>
    
    <!-- Profile Modal -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Profile Management</h3>
                <button id="profile-modal-close-button" class="modal-close-button">×</button>
            </div>
            <div class="modal-body">
                <div id="profile-info">
                    <p>Current Profile: <strong id="current-profile-name">Default</strong></p>
                    <button id="logout-button" class="form-submit-btn" style="background-color: #e74c3c;">Logout</button>
                </div>
                <hr style="margin: 20px 0;">
                <form id="profile-form">
                    <div class="form-group">
                        <label for="profile-name">Profile Name</label>
                        <input type="text" id="profile-name" required placeholder="Enter profile name">
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="form-submit-btn">Switch/Create Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

        };
        
        const themes = [
             { name: 'LightHighContrast', values: { '--primary-color': '#0053b3', '--primary-color-dark': '#00408c', '--background-gradient-start': '#ffffff', '--background-gradient-end': '#f0f2f5', '--container-bg': '#ffffff', '--text-primary': '#000000', '--text-secondary': '#555555', '--quick-access-bg': '#e9ecef', '--item-bg': '#f8f9fa', '--item-hover-bg': '#e9ecef', '--delete-color': '#d90429' }},
            { name: 'Default', values: { '--primary-color': '#3498db', '--primary-color-dark': '#2980b9', '--background-gradient-start': '#e0eafc', '--background-gradient-end': '#cfdef3', '--container-bg': '#ffffff', '--text-primary': '#2c3e50', '--text-secondary': '#7f8c8d', '--quick-access-bg': '#eef5fc', '--item-bg': '#ffffff', '--item-hover-bg': '#f0f0f0'}},
            { name: 'Ocean', values: { '--primary-color': '#1abc9c', '--primary-color-dark': '#16a085', '--background-gradient-start': '#E0F2F1', '--background-gradient-end': '#B2DFDB', '--container-bg': '#ffffff', '--text-primary': '#004D40', '--text-secondary': '#00796B', '--quick-access-bg': '#E0F2F1', '--item-bg': '#ffffff', '--item-hover-bg': '#f0f0f0'}},
            { name: 'Sunset', values: { '--primary-color': '#e74c3c', '--primary-color-dark': '#c0392b', '--background-gradient-start': '#FAD7A1', '--background-gradient-end': '#E9A8A6', '--container-bg': '#fff8f2', '--text-primary': '#5D4037', '--text-secondary': '#8D6E63', '--quick-access-bg': '#FBE9E7', '--item-bg': '#ffffff', '--item-hover-bg': '#f0f0f0'}},
            { name: 'Forest', values: { '--primary-color': '#27ae60', '--primary-color-dark': '#229954', '--background-gradient-start': '#E8F5E9', '--background-gradient-end': '#C8E6C9', '--container-bg': '#f9fcf9', '--text-primary': '#1B5E20', '--text-secondary': '#388E3C', '--quick-access-bg': '#E8F5E9', '--item-bg': '#ffffff', '--item-hover-bg': '#f0f0f0'}},
            { name: 'Lavender', values: { '--primary-color': '#8e44ad', '--primary-color-dark': '#7d3c98', '--background-gradient-start': '#F3E5F5', '--background-gradient-end': '#E1BEE7', '--container-bg': '#ffffff', '--text-primary': '#4A148C', '--text-secondary': '#6A1B9A', '--quick-access-bg': '#F3E5F5', '--item-bg': '#ffffff', '--item-hover-bg': '#f0f0f0'}},
            { name: 'Graphite', values: { '--primary-color': '#f39c12', '--primary-color-dark': '#f1c40f', '--background-gradient-start': '#424242', '--background-gradient-end': '#212121', '--container-bg': '#303030', '--text-primary': '#ffffff', '--text-secondary': '#BDBDBD', '--quick-access-bg': '#424242', '--item-bg': '#424242', '--item-hover-bg': '#555555'}},
            { name: 'Mint', values: { '--primary-color': '#00A896', '--primary-color-dark': '#007A6E', '--background-gradient-start': '#d4f2ea', '--background-gradient-end': '#a6e4d5', '--container-bg': '#f5fffd', '--text-primary': '#023535', '--text-secondary': '#015958', '--quick-access-bg': '#e0f6f0', '--item-bg': '#ffffff', '--item-hover-bg': '#f0f0f0'}},
            { name: 'Cherry Blossom', values: { '--primary-color': '#ff7b9b', '--primary-color-dark': '#ff5c8a', '--background-gradient-start': '#fde2e4', '--background-gradient-end': '#fad2e1', '--container-bg': '#fff0f3', '--text-primary': '#582b47', '--text-secondary': '#8c4f69', '--quick-access-bg': '#fde2e4', '--item-bg': '#ffffff', '--item-hover-bg': '#f0f0f0'}},
            { name: 'Sandstone', values: { '--primary-color': '#f28444', '--primary-color-dark': '#d46a2a', '--background-gradient-start': '#fdead7', '--background-gradient-end': '#f7d6b7', '--container-bg': '#fff8f0', '--text-primary': '#613819', '--text-secondary': '#915426', '--quick-access-bg': '#fdead7', '--item-bg': '#ffffff', '--item-hover-bg': '#f0f0f0'}},
            { name: 'Midnight', values: { '--primary-color': '#4e54c8', '--primary-color-dark': '#3a3f99', '--background-gradient-start': '#2c3e50', '--background-gradient-end': '#1b2838', '--container-bg': '#273444', '--text-primary': '#ffffff', '--text-secondary': '#bdc3c7', '--quick-access-bg': '#34495e', '--item-bg': '#424242', '--item-hover-bg': '#555555'}},
        ];
        let currentThemeIndex = 0;
        let allBookmarksData = [];
        let groupedBookmarks = {};
        let openCategories = [];

        // --- All JS functions are here and complete ---
        
        function loadBookmarks() {
            const profileKey = currentProfile || 'Default';
            const storedUserBookmarks = localStorage.getItem(`userBookmarks_${profileKey}`) || localStorage.getItem('userBookmarks');
            const storedDeletedInitial = localStorage.getItem(`deletedInitialBookmarks_${profileKey}`) || localStorage.getItem('deletedInitialBookmarks');
            
            const userBookmarks = storedUserBookmarks ? JSON.parse(storedUserBookmarks) : [];
            const deletedInitialUrls = storedDeletedInitial ? JSON.parse(storedDeletedInitial) : [];

            const activeInitialBookmarks = initialBookmarks.filter(
                b => !deletedInitialUrls.includes(b.url)
            );

            allBookmarksData = [...activeInitialBookmarks, ...userBookmarks];
        }

        function saveBookmarks() {
            const profileKey = currentProfile || 'Default';
            const userBookmarks = allBookmarksData.filter(b => !initialBookmarks.some(ib => ib.url === b.url && ib.title === b.title));
            localStorage.setItem(`userBookmarks_${profileKey}`, JSON.stringify(userBookmarks));
            localStorage.setItem('userBookmarks', JSON.stringify(userBookmarks)); // Keep backwards compatibility
        }
        
        function getFaviconUrl(url) {
             try {
                if (url && url !== '#') {
                    const domain = new URL(url).hostname;
                    return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                }
                return "https://placehold.co/64x64/cccccc/000000?text=?";
            } catch (error) {
                return "https://placehold.co/64x64/cccccc/000000?text=?";
            }
        }
        
        function groupBookmarksByFolder(bookmarks) {
            return bookmarks.reduce((acc, bookmark) => {
                const folderName = bookmark.folder || 'Inne';
                if (!acc[folderName]) acc[folderName] = [];
                acc[folderName].push(bookmark);
                return acc;
            }, {});
        }

        function renderQuickAccessLinks() {
            const quickAccessSection = document.getElementById('quick-access-section');
            quickAccessSection.innerHTML = '';
            quickAccessLinks.forEach(link => {
                const anchor = document.createElement('a');
                anchor.href = link.url;
                if(link.icon) {
                    anchor.id = "add-bookmark-btn";
                }
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                anchor.className = "quick-access-item";

                if (link.svg) {
                    const iconDiv = document.createElement('div');
                    iconDiv.className = "quick-access-icon";
                    iconDiv.innerHTML = link.svg;
                    anchor.appendChild(iconDiv);
                } else if (link.icon) {
                    const iconSpan = document.createElement('span');
                    iconSpan.className = "quick-access-icon";
                    iconSpan.textContent = link.icon;
                    anchor.appendChild(iconSpan);
                } else {
                    const img = document.createElement('img');
                    img.src = getFaviconUrl(link.url);
                    img.alt = link.title;
                    img.className = "quick-access-icon";
                    img.onerror = function() { this.onerror=null; this.src="https://placehold.co/40x40/cccccc/000000?text=?"; };
                    anchor.appendChild(img);
                }

                const titleDiv = document.createElement('div');
                titleDiv.className = "quick-access-title";
                titleDiv.textContent = link.title;
                anchor.appendChild(titleDiv);

                quickAccessSection.appendChild(anchor);
            });
            const addBtn = document.getElementById('add-bookmark-btn');
            if (addBtn) {
                 addBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    openAddModal();
                });
            }
        }
        
        function renderBookmarkCategories() {
            const categoriesSection = document.getElementById('bookmark-categories-section');
            categoriesSection.innerHTML = '';

            const sortedFolderNames = Object.keys(groupedBookmarks).sort((a, b) => a.localeCompare(b));

            sortedFolderNames.forEach(folderName => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = `category-section ${openCategories.includes(folderName) ? 'open' : ''}`;
                
                const h2 = document.createElement('h2');
                h2.textContent = `📁 ${folderName}`;
                h2.onclick = () => toggleCategory(folderName);
                categoryDiv.appendChild(h2);

                const ul = document.createElement('ul');
                groupedBookmarks[folderName].forEach(bookmark => {
                    const liWrapper = document.createElement('div');
                    liWrapper.className = 'bookmark-item-wrapper';

                    const liContent = document.createElement('div');
                    liContent.className = 'bookmark-item-content';
                    liContent.dataset.bookmark = JSON.stringify(bookmark);
                    
                    liContent.addEventListener('contextmenu', showContextMenu);

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'swipe-delete-button';
                    deleteButton.innerHTML = '🗑️';
                    deleteButton.onclick = () => deleteBookmark(bookmark);

                    const img = document.createElement('img');
                    img.src = getFaviconUrl(bookmark.url);
                    img.alt = bookmark.title;
                    img.className = "category-favicon";
                    img.onerror = function() { this.onerror=null; this.src="https://placehold.co/28x28/cccccc/000000?text=?"; };
                    liContent.appendChild(img);
                    
                    const detailsDiv = document.createElement('div');
                    detailsDiv.className = 'bookmark-details';

                    const anchor = document.createElement('a');
                    anchor.href = bookmark.url;
                    anchor.target = "_blank";
                    anchor.rel = "noopener noreferrer";
                    anchor.textContent = bookmark.title;
                    detailsDiv.appendChild(anchor);

                    if (bookmark.description) {
                        const descDiv = document.createElement('div');
                        descDiv.className = "bookmark-description";
                        descDiv.textContent = bookmark.description;
                        detailsDiv.appendChild(descDiv);
                    }
                    liContent.appendChild(detailsDiv);
                    
                    liWrapper.appendChild(liContent);
                    liWrapper.appendChild(deleteButton);
                    
                    addTouchEvents(liContent);

                    ul.appendChild(liWrapper);
                });
                categoryDiv.appendChild(ul);
                categoriesSection.appendChild(categoryDiv);
            });
        }

        function deleteBookmark(bookmarkToDelete) {
             if (confirm(`Are you sure you want to delete "${bookmarkToDelete.title}"?`)) {
                const isInitial = initialBookmarks.some(
                    b => b.url === bookmarkToDelete.url && b.title === bookmarkToDelete.title
                );

                if (isInitial) {
                    const profileKey = currentProfile || 'Default';
                    const storedDeletedInitial = localStorage.getItem(`deletedInitialBookmarks_${profileKey}`) || localStorage.getItem('deletedInitialBookmarks');
                    const deletedInitialUrls = storedDeletedInitial ? JSON.parse(storedDeletedInitial) : [];
                    if (!deletedInitialUrls.includes(bookmarkToDelete.url)) {
                        deletedInitialUrls.push(bookmarkToDelete.url);
                        localStorage.setItem(`deletedInitialBookmarks_${profileKey}`, JSON.stringify(deletedInitialUrls));
                        localStorage.setItem('deletedInitialBookmarks', JSON.stringify(deletedInitialUrls));
                    }
                }
                
                allBookmarksData = allBookmarksData.filter(
                    b => !(b.url === bookmarkToDelete.url && b.title === bookmarkToDelete.title)
                );
                
                saveBookmarks();
                filterAndRenderBookmarks(document.getElementById('search-input').value);
             }
        }
        
        function toggleCategory(categoryName) {
            const index = openCategories.indexOf(categoryName);
            if (index > -1) {
                openCategories.splice(index, 1);
            } else {
                openCategories.push(categoryName);
            }
            renderBookmarkCategories();
        }
        
        function filterAndRenderBookmarks(searchTerm = "") {
            const term = searchTerm.toLowerCase();
            const filteredRawBookmarks = allBookmarksData.filter(bookmark => {
                if (!term) return true;
                const titleMatch = bookmark.title && bookmark.title.toLowerCase().includes(term);
                const urlMatch = bookmark.url && bookmark.url.toLowerCase().includes(term);
                const descriptionMatch = bookmark.description && bookmark.description.toLowerCase().includes(term);
                return titleMatch || urlMatch || descriptionMatch;
            });
            
            groupedBookmarks = groupBookmarksByFolder(filteredRawBookmarks);
            
            if (term) {
                const newOpenCategories = Object.keys(groupedBookmarks);
                openCategories = [...new Set([...openCategories, ...newOpenCategories])];
            }
            
            renderBookmarkCategories();
            
            const noResultsMessage = document.getElementById('no-results-message');
            const shouldShowNoResults = filteredRawBookmarks.length === 0 && term;
            noResultsMessage.style.display = shouldShowNoResults ? 'block' : 'none';
            if (shouldShowNoResults) {
                 noResultsMessage.innerHTML = `No results found for "${searchTerm}".`;
            }
        }
        
        function executeSearch() {
            const searchInput = document.getElementById('search-input');
            const searchTerm = searchInput.value.trim();
            const loader = document.getElementById('search-loader');
            const noResultsMessage = document.getElementById('no-results-message');

            if (!searchTerm) {
                filterAndRenderBookmarks('');
                return;
            }

            const exactMatch = allBookmarksData.find(b => b.title.toLowerCase() === searchTerm.toLowerCase());
            if (exactMatch) {
                window.open(exactMatch.url, '_blank');
                return;
            }

            const term = searchTerm.toLowerCase();
            const filteredRawBookmarks = allBookmarksData.filter(bookmark => {
                const titleMatch = bookmark.title && bookmark.title.toLowerCase().includes(term);
                const urlMatch = bookmark.url && bookmark.url.toLowerCase().includes(term);
                const descriptionMatch = bookmark.description && bookmark.description.toLowerCase().includes(term);
                return titleMatch || urlMatch || descriptionMatch;
            });

            if (filteredRawBookmarks.length > 0) {
                filterAndRenderBookmarks(searchTerm);
            } else {
                noResultsMessage.innerHTML = 'Searching on Google...';
                noResultsMessage.style.display = 'block';
                loader.style.display = 'inline-block';
                document.getElementById('bookmark-categories-section').innerHTML = '';
                
                const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(searchTerm)}`;
                window.open(googleUrl, '_blank');

                setTimeout(() => {
                    loader.style.display = 'none';
                    noResultsMessage.style.display = 'none';
                    searchInput.value = '';
                    filterAndRenderBookmarks('');
                }, 3500);
            }
        }
        
        function addTouchEvents(element) {
            let touchStartX = 0;
            let touchStartTime = 0;
            let longPressTimeout;

            element.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartTime = new Date().getTime();
                
                longPressTimeout = setTimeout(() => {
                    console.log('Long press detected on:', JSON.parse(element.dataset.bookmark).title);
                }, 500);
            }, { passive: true });

            element.addEventListener('touchmove', e => {
                 clearTimeout(longPressTimeout);
            });

            element.addEventListener('touchend', e => {
                clearTimeout(longPressTimeout);
                const touchEndX = e.changedTouches[0].clientX;
                const swipeDistance = touchStartX - touchEndX;

                document.querySelectorAll('.bookmark-item-content.swiped').forEach(item => {
                    if(item !== element) item.classList.remove('swiped');
                });

                if (swipeDistance > 50) { 
                    element.classList.add('swiped');
                } else if (swipeDistance < -50) {
                    element.classList.remove('swiped');
                }
            });
        }

        function getDynamicGreeting() {
            if (allGreetingsForHeader && allGreetingsForHeader.length > 0) {
                const randomGreetingIndex = Math.floor(Math.random() * allGreetingsForHeader.length);
                return allGreetingsForHeader[randomGreetingIndex];
            }
            return null;
        }

        function applyTheme(theme) {
            const root = document.documentElement;
            for (const [key, value] of Object.entries(theme.values)) {
                root.style.setProperty(key, value);
            }
        }
        
        function changeTheme() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * themes.length);
            } while (newIndex === currentThemeIndex); 
            
            currentThemeIndex = newIndex;
            applyTheme(themes[currentThemeIndex]);
        }
        
        function openAddModal() {
            const datalist = document.getElementById('category-suggestions');
            datalist.innerHTML = '';
            const existingCategories = [...new Set(allBookmarksData.map(b => b.folder))];
            existingCategories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                datalist.appendChild(option);
            });
            document.getElementById('add-bookmark-modal').classList.add('open');
        }

        function closeAddModal() {
             document.getElementById('add-bookmark-modal').classList.remove('open');
             document.getElementById('add-bookmark-form').reset();
        }
        
        let currentContextMenuTarget = null;
        const contextMenu = document.getElementById('custom-context-menu');

        function showContextMenu(e) {
            e.preventDefault();
            hideContextMenu();
            currentContextMenuTarget = e.currentTarget;
            contextMenu.style.top = `${e.pageY}px`;
            contextMenu.style.left = `${e.pageX}px`;
            contextMenu.style.display = 'block';
        }

        function hideContextMenu() {
            contextMenu.style.display = 'none';
            currentContextMenuTarget = null;
        }

        function animateGreetingHeader(element, emoji, text) {
            const container = element.parentElement;
            container.classList.remove('interactive');
            element.innerHTML = '';
            element.classList.add('typewriter-bounce');

            if (emoji) {
                const emojiSpan = document.createElement('span');
                emojiSpan.textContent = emoji + '\u00A0';
                element.appendChild(emojiSpan);
            }

            let delay = 0;
            text.split('').forEach(char => {
                const span = document.createElement('span');
                span.className = 'char';
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.style.animationDelay = `${delay}ms`;
                element.appendChild(span);
                delay += 70;
            });

            setTimeout(() => {
                container.classList.add('interactive');
            }, delay + 200);
        }

        // Profile Management Functions
        let currentProfile = localStorage.getItem('currentProfile') || 'Default';
        
        function switchProfile(profileName) {
            currentProfile = profileName;
            localStorage.setItem('currentProfile', profileName);
            loadBookmarks();
            filterAndRenderBookmarks('');
            updateProfileDisplay();
        }

        function updateProfileDisplay() {
            document.getElementById('current-profile-name').textContent = currentProfile;
        }

        function exportBookmarks() {
            const exportData = {
                profile: currentProfile,
                userBookmarks: localStorage.getItem(`userBookmarks_${currentProfile}`) || localStorage.getItem('userBookmarks'),
                deletedInitialBookmarks: localStorage.getItem(`deletedInitialBookmarks_${currentProfile}`) || localStorage.getItem('deletedInitialBookmarks'),
                timestamp: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `bookmarks_${currentProfile}_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            alert('Bookmarks exported successfully!');
        }

        function importBookmarks(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importData = JSON.parse(e.target.result);
                    if (importData.userBookmarks) {
                        localStorage.setItem(`userBookmarks_${currentProfile}`, importData.userBookmarks);
                        localStorage.setItem('userBookmarks', importData.userBookmarks);
                    }
                    if (importData.deletedInitialBookmarks) {
                        localStorage.setItem(`deletedInitialBookmarks_${currentProfile}`, importData.deletedInitialBookmarks);
                        localStorage.setItem('deletedInitialBookmarks', importData.deletedInitialBookmarks);
                    }
                    loadBookmarks();
                    filterAndRenderBookmarks('');
                    alert('Bookmarks imported successfully!');
                } catch (error) {
                    alert('Error importing bookmarks. Please check the file format.');
                    console.error('Import error:', error);
                }
            };
            reader.readAsText(file);
        }

        function openProfileModal() {
            document.getElementById('profile-modal').classList.add('open');
            updateProfileDisplay();
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.remove('open');
        }

        function logoutProfile() {
            if (confirm('Are you sure you want to logout? This will switch to the Default profile.')) {
                switchProfile('Default');
                closeProfileModal();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBookmarks();
            
            const themeButton = document.getElementById('theme-button');
            themeButton.addEventListener('click', changeTheme);
            
            const defaultTheme = themes.find(t => t.name === 'Lavender');
            if (defaultTheme) {
                applyTheme(defaultTheme);
                currentThemeIndex = themes.indexOf(defaultTheme);
            }

            const addModalCloseButton = document.getElementById('add-modal-close-button');
            const addBookmarkForm = document.getElementById('add-bookmark-form');
            const deleteContextBtn = document.getElementById('delete-context-btn');
            
            addModalCloseButton.addEventListener('click', closeAddModal);

            addBookmarkForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const newBookmark = {
                    title: document.getElementById('bookmark-title').value,
                    url: document.getElementById('bookmark-url').value,
                    folder: document.getElementById('bookmark-folder').value,
                    description: document.getElementById('bookmark-description').value,
                };
                allBookmarksData.push(newBookmark);
                saveBookmarks();
                closeAddModal();
                filterAndRenderBookmarks();
            });
            
            deleteContextBtn.addEventListener('click', () => {
                if (currentContextMenuTarget) {
                    const bookmarkData = JSON.parse(currentContextMenuTarget.dataset.bookmark);
                    deleteBookmark(bookmarkData);
                }
                hideContextMenu();
            });

            window.addEventListener('click', hideContextMenu);
            
            // Profile, Export, Import buttons
            const profileButton = document.getElementById('profile-button');
            const exportButton = document.getElementById('export-button');
            const importButton = document.getElementById('import-button');
            const importFileInput = document.getElementById('import-file-input');
            const profileModalCloseButton = document.getElementById('profile-modal-close-button');
            const profileForm = document.getElementById('profile-form');
            const logoutButton = document.getElementById('logout-button');
            
            profileButton.addEventListener('click', openProfileModal);
            exportButton.addEventListener('click', exportBookmarks);
            importButton.addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importBookmarks(e.target.files[0]);
                    e.target.value = ''; // Reset input
                }
            });
            profileModalCloseButton.addEventListener('click', closeProfileModal);
            logoutButton.addEventListener('click', logoutProfile);
            profileForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const newProfileName = document.getElementById('profile-name').value.trim();
                if (newProfileName) {
                    switchProfile(newProfileName);
                    closeProfileModal();
                }
            });
            
            // Initialize profile display
            updateProfileDisplay();
            
            const splashScreen = document.getElementById('splash-screen');
            const splashMessageDiv = splashScreen.querySelector('.splash-message');
            const mainContentWrapper = document.getElementById('main-content-wrapper');
            const greetingHeader = document.getElementById('greeting-header');
            
            const splashGreeting = getDynamicGreeting();
            if (splashGreeting) {
                const translation = splashGreeting.polishTranslation || splashGreeting.text;
                splashMessageDiv.innerHTML = `<span>${splashGreeting.emoji}</span> <span>${splashGreeting.text}</span>`;
            }
            
            setTimeout(() => {
                splashScreen.classList.add('fade-out');
                setTimeout(() => { 
                    splashScreen.style.display = 'none'; 
                    mainContentWrapper.classList.add('show');
                    const headerGreeting = getDynamicGreeting();
                    if(headerGreeting) {
                        animateGreetingHeader(greetingHeader, headerGreeting.emoji, headerGreeting.text);
                        greetingHeader.addEventListener('click', () => {
                            window.open(`https://translate.google.com/?sl=auto&tl=pl&text=${encodeURIComponent(headerGreeting.text)}`, '_blank');
                        });
                    }
                }, 600);
            }, 3500);

            
            const scriptId = 'weatherwidget-io-js';
            if (!document.getElementById(scriptId)) {
                const script = document.createElement('script');
                script.id = scriptId;
                script.src = 'https://weatherwidget.io/js/widget.min.js';
                script.async = true;
                document.body.appendChild(script);
            }
            
            filterAndRenderBookmarks('');
            renderQuickAccessLinks();

            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', () => filterAndRenderBookmarks(searchInput.value));
            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    executeSearch();
                }
            });
        });

    </script>
</body>
